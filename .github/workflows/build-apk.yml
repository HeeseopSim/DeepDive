name: Build waiting-queue APK

on:
  workflow_dispatch:
  push:
    branches: [claude/waiting-queue-qr-system-6jl2fc]
    paths:
      - "waiting-queue/android/**"
      - ".github/workflows/build-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: waiting-queue/android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: qr-waiting-queue-apk
          path: waiting-queue/android/app/build/outputs/apk/debug/app-debug.apk
